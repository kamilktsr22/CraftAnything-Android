name: Android ARM64 Debug APK

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK + NDK
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Set up Rust (Android ARM64)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
          cache: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Offline structural check
        run: python3 scripts/sanity-check.py
      - name: Rust unit tests (host)
        working-directory: rust-core
        run: cargo test
      - name: Compile native ARM64 library
        run: bash scripts/build-rust.sh
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftAnythingAndroid-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
